name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # macOS and Linux each have a real platform module, so each gets a full leg:
  # this one, and `package` below.
  check:
    name: fmt · clippy · test · build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Build (release)
        run: cargo build --release

  # The Linux leg. Its platform module is invisible to the macOS job above, and
  # crates.io and docs.rs build here too, so this is also where packaging is
  # checked.
  package:
    name: linux build · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Clippy (Linux platform module)
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      # Catches manifest problems on the PR instead of on a release tag.
      - name: Package for crates.io
        run: cargo publish --dry-run --locked
