name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The full suite runs on macOS, the only OS with a real platform module. A
  # Linux module (nl80211) would promote `package` below into a second leg.
  check:
    name: fmt · clippy · test · build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Build (release)
        run: cargo build --release

  # crates.io and docs.rs build on Linux, so the non-macOS fallback has to keep
  # compiling — a break there is invisible to the macOS job above.
  package:
    name: linux build · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check (non-macOS platform fallback)
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      # Catches manifest problems on the PR instead of on a release tag.
      - name: Package for crates.io
        run: cargo publish --dry-run --locked
