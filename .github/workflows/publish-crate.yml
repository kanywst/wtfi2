# Publishes to crates.io on a release tag. Deliberately separate from
# release.yml, which dist regenerates — a hand-written job there is a patch
# waiting to be lost. Independent of the dist jobs, so neither channel can block
# the other.

name: Publish crate

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Fail rather than skip: a publish channel that quietly stops is worse
      # than a red release.
      - name: Require the token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Create a publish-scoped token at https://crates.io/settings/tokens, then: gh secret set CARGO_REGISTRY_TOKEN"
            exit 1
          fi

      # A crates.io release is permanent — a wrong version can only be yanked.
      - name: Check the tag matches the manifest version
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
