# Publishes wtfi2 to crates.io on a release tag.
#
# Deliberately separate from release.yml: that file is generated by dist and
# gets overwritten whenever the pipeline is regenerated, so anything hand-written
# in it is a patch waiting to be lost. This runs on the same tag pattern and is
# independent of the dist jobs — a crates.io outage cannot hold up the GitHub
# release or the Homebrew tap, and vice versa.

name: Publish crate

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    # The token lives as an environment secret, matching how the Claude
    # workflows source theirs, so the job has to name the environment to see it.
    environment: CARGO_REGISTRY_TOKEN
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Require the token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Create a publish-scoped token at https://crates.io/settings/tokens, then: gh secret set CARGO_REGISTRY_TOKEN"
            exit 1
          fi

      # A crates.io release is permanent — a wrong version can only be yanked,
      # never replaced. Refuse before uploading if the tag and the manifest
      # disagree.
      - name: Check the tag matches the manifest version
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
