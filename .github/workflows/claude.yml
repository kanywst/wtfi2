name: Claude

# Interactive assistant: mention @claude in an issue or pull request comment and
# it answers with the full repo context. The automatic reviewer lives in
# claude-review.yml; this is the one you talk to.
#
# Same subscription-based auth as the reviewer (CLAUDE_CODE_OAUTH_TOKEN).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

# One conversation at a time per thread. A second mention while the first is
# still working queues behind it rather than racing it, since both would be
# writing comments to the same place.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only wake up when someone actually mentions @claude, and only for people
    # who can already push here. The job holds a token that runs against a
    # personal Claude subscription, so a drive-by comment on a public repo must
    # not be able to spend it.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The token is an environment secret here rather than a repository one, so
    # the job has to name the environment to see it at all.
    environment: CLAUDE_CODE_OAUTH_TOKEN
    permissions:
      contents: read
      issues: write
      pull-requests: write
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Nothing here pushes, and the action authenticates through the GitHub
          # App rather than this token.
          persist-credentials: false

      # A mention that silently does nothing looks like Claude ignored you.
      # Fail where the reason is legible instead.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50 # v1
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
