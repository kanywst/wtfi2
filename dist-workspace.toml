[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Publish the Homebrew formula to this tap on release
tap = "kanywst/homebrew-tap"
publish-jobs = ["homebrew"]
# The tap PAT is read from HOMEBREW_TAP_TOKEN, which is dist's own name for it:
# the generated publish job hardcodes it and there is no option here to change
# it. The account's other tap publishers — spiffe-compliance-checker,
# mcp-opa-authz, wimsey — call the same PAT HOMEBREW_TAP_GITHUB_TOKEN because
# they write the job themselves. Do not "fix" that inconsistency here. Renaming
# means hand-patching a generated line against the generator, and a later
# regeneration puts HOMEBREW_TAP_TOKEN back, at which point releases fail
# looking for a secret that was renamed away.
# We hand-patch release.yml (idempotent formula commit, and a fix for dist's
# `steps.cargo-cyclonedx.output.paths` typo), so opt out of dist's "CI is up to
# date" check for that file. The two supply-chain options below are therefore
# also hand-applied to release.yml — they are recorded here so a regeneration
# brings them back rather than silently dropping them.
allow-dirty = ["ci"]
# Sigstore-backed build provenance for every released binary, verifiable with
# `gh attestation verify <file> --repo kanywst/wtfi2`. This is the signature:
# GitHub's attestation service issues it keylessly, so there is no key to hold.
github-attestations = true
# CycloneDX SBOM (.cdx.xml) published alongside the binaries, so a consumer can
# tell what is inside a release without building it.
cargo-cyclonedx = true
# macOS only — the platform layer targets macOS (Linux is on the roadmap)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
